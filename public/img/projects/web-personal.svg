<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Vista de la web personal con su chatbot de IA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061310"/>
      <stop offset="1" stop-color="#04080a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#2bd96a" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#2bd96a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="#2bd96a" opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect width="1200" height="675" fill="url(#scan)"/>

  <!-- Ventana de terminal -->
  <g>
    <rect x="90" y="110" width="720" height="470" rx="14" fill="#0a130d" stroke="#173626" stroke-width="2"/>
    <rect x="90" y="110" width="720" height="48" rx="14" fill="#0e1a12"/>
    <rect x="90" y="146" width="720" height="12" fill="#0e1a12"/>
    <circle cx="124" cy="134" r="7" fill="#2bd96a"/>
    <circle cx="150" cy="134" r="7" fill="#173626"/>
    <circle cx="176" cy="134" r="7" fill="#173626"/>
    <text x="430" y="139" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" fill="#63b083">enriquegf.com</text>

    <!-- Contenido tipo prompt -->
    <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="26" fill="#cdf6da">
      <tspan x="130" y="225"><tspan fill="#2bd96a">&gt;</tspan> whoami</tspan>
      <tspan x="130" y="270" fill="#63b083">Enrique García-Ferrer</tspan>
      <tspan x="130" y="300" fill="#63b083">Software &amp; AI Engineer</tspan>
    </text>
    <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="26" fill="#cdf6da">
      <tspan x="130" y="370"><tspan fill="#2bd96a">&gt;</tspan> stack --list</tspan>
    </text>
    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" fill="#2bd96a">
      <rect x="130" y="395" width="118" height="36" rx="5" fill="#2bd96a" opacity="0.12"/>
      <text x="146" y="419">Astro</text>
      <rect x="262" y="395" width="160" height="36" rx="5" fill="#2bd96a" opacity="0.12"/>
      <text x="278" y="419">Tailwind</text>
      <rect x="436" y="395" width="150" height="36" rx="5" fill="#2bd96a" opacity="0.12"/>
      <text x="452" y="419">Mistral</text>
      <rect x="600" y="395" width="140" height="36" rx="5" fill="#2bd96a" opacity="0.12"/>
      <text x="616" y="419">Docker</text>
    </g>
    <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="26" fill="#cdf6da">
      <tspan x="130" y="495"><tspan fill="#2bd96a">&gt;</tspan> ai.chat<tspan fill="#2bd96a">▋</tspan></tspan>
    </text>
  </g>

  <!-- Widget de chatbot -->
  <g>
    <rect x="788" y="300" width="332" height="248" rx="16" fill="#0a130d" stroke="#2bd96a" stroke-width="2"/>
    <rect x="788" y="300" width="332" height="52" rx="16" fill="#0e1a12"/>
    <rect x="788" y="338" width="332" height="14" fill="#0e1a12"/>
    <circle cx="814" cy="326" r="6" fill="#2bd96a"/>
    <text x="832" y="332" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" fill="#cdf6da">Asistente</text>

    <!-- Burbuja bot -->
    <rect x="810" y="372" width="220" height="60" rx="10" fill="#0e1a12" stroke="#173626" stroke-width="1.5"/>
    <text x="826" y="398" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#cdf6da"><tspan fill="#2bd96a">&gt;_</tspan> ¿En qué trabaja</text>
    <text x="826" y="418" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#cdf6da">Enrique?</text>

    <!-- Burbuja usuario -->
    <rect x="878" y="446" width="220" height="40" rx="10" fill="#2bd96a"/>
    <text x="1088" y="471" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#03140a">Cuéntame su stack</text>

    <!-- Input -->
    <rect x="810" y="500" width="232" height="34" rx="8" fill="#04080a" stroke="#173626" stroke-width="1.5"/>
    <text x="824" y="522" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" fill="#3d6b51">Escribe tu pregunta…</text>
    <rect x="1052" y="500" width="46" height="34" rx="8" fill="#2bd96a"/>
    <path d="M1086 510l-20 7 8 3 3 8 9-18z" fill="#03140a"/>
  </g>

  <!-- Etiqueta RAG -->
  <g>
    <rect x="788" y="566" width="200" height="34" rx="17" fill="#2bd96a" opacity="0.12"/>
    <circle cx="808" cy="583" r="5" fill="#2bd96a"/>
    <text x="822" y="589" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#2bd96a">RAG · embeddings</text>
  </g>
</svg>
